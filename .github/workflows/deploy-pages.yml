# 사이트를 정적으로 빌드해 GitHub Pages 에 올린다.
#
# 원래 Vercel 에 올렸는데 Hobby 한도를 넘어 프로젝트가 통째로 멈췄다
# (HTTP 402 / DEPLOYMENT_DISABLED). 빌드 결과를 보면 서버가 필요한 건
# 이미지 최적화와 조건 검색 몇 개뿐이었고, 데이터는 저장소의 JSON 이라
# 애초에 서버가 할 일이 없었다. 그래서 HTML 을 통째로 구워 Pages 에 올린다.
# 대역폭 무제한, 무료, 한도에 걸릴 자원 자체가 없다.
name: 사이트 배포 (GitHub Pages)

on:
  push:
    branches: [main]
  # 데이터가 그대로여도 날짜가 바뀌면 D-day 가 달라지므로 매일 한 번 다시 굽는다.
  # 데이터 갱신 워크플로(04:00 KST)가 끝난 뒤에 돈다.
  schedule:
    - cron: "30 19 * * *" # 매일 19:30 UTC = 다음날 04:30 KST
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만. 진행 중인 것을 취소하지 않고 기다린다
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node 설정
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Pages 설정
        # enablement: true 면 저장소에 Pages 가 꺼져 있어도 켜 준다
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: 의존성 설치
        # npm ci 를 쓰지 않는다. package-lock.json 이 Windows 에서 생성되어
        # 리눅스 러너에 필요한 플랫폼별 선택적 의존성(@emnapi 등)이 빠져 있어 ci 가 실패한다.
        run: npm install --no-audit --no-fund

      - name: 단위 테스트
        run: npm test

      - name: 정적 빌드
        env:
          # 저장소 이름이 경로에 붙는다: https://<user>.github.io/festival-calendar/
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: npm run build

      - name: Jekyll 처리 막기
        # _next 처럼 밑줄로 시작하는 폴더를 GitHub Pages 가 숨기지 않도록
        run: touch out/.nojekyll

      - name: 결과물 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pages 에 배포
        id: deployment
        uses: actions/deploy-pages@v4

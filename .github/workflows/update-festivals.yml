# 매주 월요일 새벽(KST 04:00 = UTC 19:00 일요일) 축제 데이터를 다시 받아와
# 변경이 있으면 커밋한다. 커밋이 main 에 올라가면 Vercel 이 자동 배포한다.
name: 축제 데이터 갱신

on:
  schedule:
    - cron: "0 19 * * 0" # 일요일 19:00 UTC = 월요일 04:00 KST
  workflow_dispatch: # 수동 실행 허용

permissions:
  contents: write

concurrency:
  group: update-festivals
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node 설정
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 축제 데이터 수집
        # 실패하면(exit 1) festivals.json 은 그대로이므로 아래 단계에서 변경이 없어 커밋되지 않는다
        env:
          TOUR_API_KEY: ${{ secrets.TOUR_API_KEY }}
        run: npm run fetch:festivals -- --max-detail=600

      - name: 단위 테스트
        run: npm test

      - name: 변경사항 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/festivals.json
          if git diff --cached --quiet; then
            echo "변경된 데이터가 없어 커밋하지 않습니다."
          else
            COUNT=$(node -e "console.log(require('./data/festivals.json').meta.count)")
            git commit -m "데이터: 축제 정보 자동 갱신 (${COUNT}건)"
            git push
          fi
